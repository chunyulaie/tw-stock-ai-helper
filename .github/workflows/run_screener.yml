name: Taiwan Stock AI Auto Screener

on:
  # 🎯 手動觸發開關：讓你想測試時，隨時點網頁就能按
  workflow_dispatch:

  # 🎯 雲端定時開關（Cron Job）：設定台北時間每週日到週四晚上 22:00 自動開炸戰報
  # 換算 UTC 時間為：每週日到週四下午 14:00
  schedule:
    - cron: '0 14 * * 0-4'

jobs:
  screener_job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas xgboost ta scikit-learn line-bot-sdk requests

    - name: Run AI Screener Engine
      run: |
        python cron_screener.py