name: 台股 AI 1開頭雲端極速測試

on:
  workflow_dispatch: # 允許網頁上手動一鍵點火

jobs:
  run-ai-test:
    runs-on: ubuntu-latest
    steps:
    - name: 複製雲端代碼
      uses: actions/checkout@v3

    - name: 初始化 Python 3.10 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝硬核量化套件
      run: |
        # 🎯 這裡強行補上 scikit-learn，徹底填滿 XGBoost 的底層天坑！
        pip install pandas yfinance xgboost ta requests line-bot-sdk pillow openpyxl scikit-learn

    - name: 強行啟動 1開頭限定海選與 LINE 雙推
      run: |
        python cron_screener.py